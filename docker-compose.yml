services:
  mysql:
    image: mysql:8.0
    container_name: code-impact-mysql
    environment:
      MYSQL_DATABASE: code_impact
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root","-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: code-impact-backend
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQLHOST: mysql
      MYSQLPORT: 3306
      MYSQLDATABASE: code_impact
      MYSQLUSER: root
      MYSQLPASSWORD: ${DB_PASSWORD}
    ports:
      - "8080:8080"

volumes:
  mysql_data: