<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Code Impact | Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(94, 231, 255, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(192, 132, 252, 0.08),
                    transparent 30%
                ),
                #050912;

            color: #ffffff;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
            padding: 35px;

            background: rgba(13, 20, 36, 0.82);
            border: 1px solid rgba(94, 231, 255, 0.15);
            border-radius: 22px;

            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);

            animation: pageLoad 0.6s ease-out;
        }

        @keyframes pageLoad {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            color: #5ee7ff;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 30px;
        }

        h1 {
            text-align: center;
            font-size: 25px;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #c9d1d9;
            font-size: 13px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;

            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 10px;

            background: rgba(5, 9, 18, 0.8);
            color: white;

            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #5ee7ff;
            box-shadow: 0 0 12px rgba(94, 231, 255, 0.12);
        }

        .login-button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: linear-gradient(
                135deg,
                #5ee7ff,
                #8b5cf6
            );

            color: #050912;
            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
            margin-top: 8px;

            transition: transform 0.2s ease,
                        filter 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            filter: brightness(1.08);
            box-shadow: 0 8px 25px rgba(94, 231, 255, 0.2);
        }

        .login-button:active {
            transform: translateY(0);
        }

        #loginMessage {
            text-align: center;
            font-size: 12px;
            margin-top: 15px;
            min-height: 18px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 22px;

            color: #8b949e;
            text-decoration: none;
            font-size: 12px;
        }

        .back-link:hover {
            color: #5ee7ff;
        }

        @media (max-width: 500px) {
            .login-container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>






    <div class="login-container">

        <div class="logo">CODE IMPACT</div>

        <div class="subtitle">
            Software Dependency Failure Recovery Simulator
        </div>

        <h1>Login</h1>

        <form id="loginForm">

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-button"
            >
                LOGIN
            </button>

            <div id="loginMessage"></div>

        </form>

        <a href="index.html" class="back-link">
            ← Back to Dashboard
        </a>

    </div>

    <script>
    
document.getElementById("loginForm").addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();
    const message = document.getElementById("loginMessage");

    if (username === "" || password === "") {
        message.style.color = "#ff4d6d";
        message.textContent = "Please enter username and password.";
        return;
    }

    sessionStorage.setItem("codeImpactLoggedIn", "true");

    message.style.color = "#4ade80";
    message.textContent = "Login successful.";

    setTimeout(function() {
        sessionStorage.setItem("codeImpactLoggedIn", "true");
        window.location.href = "./index.html";
    }, 500);
});
    </script>

</body>
</html>
